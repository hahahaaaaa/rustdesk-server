# RustDesk server reverse proxy: console/API + native WebSocket rendezvous and relay.
#
# Copy to /etc/nginx/conf.d/rustdesk.conf, then adjust:
#   - server_name
#   - certificate paths
#   - 127.0.0.1 upstreams (if nginx is not on the RustDesk host)
#
# Client settings with "Use WebSocket" enabled:
#   ID server:    rd.example.com  (the client appends :21116)
#   Relay server: leave empty (the client derives rd.example.com:21117)
# A domain endpoint becomes:
#   ws(s)://rd.example.com/ws/id     -> hbbs WebSocket  (PORT+2, 21118)
#   ws(s)://rd.example.com/ws/relay  -> hbbr WebSocket  (PORT+2, 21119)
# wss/443 is used when the client's "api-server" option starts with https;
# otherwise the client uses ws/80, so keep both server blocks.
# An IP endpoint bypasses these paths and connects to ws://IP:21118 and
# ws://IP:21119 directly.
#
# No `map $http_upgrade $connection_upgrade` on purpose: the map must live in
# the http context and is missing when a panel or OpenResty only includes the
# server block ("unknown connection_upgrade variable"). The WebSocket-only
# locations below hard-code the upgrade header; the console location forwards
# the client's own Connection header.
#
# hbbs trusts X-Real-IP/X-Forwarded-For as sent, so ports 21118/21119 must not
# be reachable directly from untrusted networks; only this proxy should reach
# them (firewall / security group).

# Port 80: WebSocket for clients without api-server=https, HTTPS redirect for
# everything else. Remove this block if all clients have api-server=https.
server {
    listen 80;
    server_name rd.example.com;

    location /ws/id {
        proxy_pass http://127.0.0.1:21118;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /ws/relay {
        proxy_pass http://127.0.0.1:21119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: TLS termination for the console/API and for WSS clients.
server {
    listen 443 ssl;
    server_name rd.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Console and management API. The browser remote-control WebSocket also
    # goes through here; forwarding the client's Connection header keeps both
    # upgrades and plain HTTP working.
    location / {
        proxy_pass http://127.0.0.1:21114;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        # Session recordings are uploaded to the API; raise if chunks exceed 1m.
        # client_max_body_size 200m;
    }

    # Native client signaling over WSS -> hbbs.
    location /ws/id {
        proxy_pass http://127.0.0.1:21118;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Native client relay over WSS -> hbbr.
    location /ws/relay {
        proxy_pass http://127.0.0.1:21119;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
