name: Docker image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "web-console/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/hahahaaaaa/rustdesk-server

jobs:
  binaries:
    name: Build binaries - ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: amd64, target: x86_64-unknown-linux-musl }
          - { name: arm64, target: aarch64-unknown-linux-musl }
          - { name: armv7, target: armv7-unknown-linux-musleabihf }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build hbbs and hbbr
        run: cross build --release --target ${{ matrix.target }} --bin hbbs --bin hbbr

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/hbbs
            target/${{ matrix.target }}/release/hbbr
          if-no-files-found: error

  image:
    name: Push image - ${{ matrix.name }}
    needs: binaries
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: amd64, platform: linux/amd64, s6: x86_64 }
          - { name: arm64, platform: linux/arm64, s6: aarch64 }
          - { name: armv7, platform: linux/arm/v7, s6: armhf }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: docker/rootfs/usr/bin

      - name: Make files executable
        run: |
          chmod -v +x docker/rootfs/usr/bin/*
          find docker/rootfs -type f \( -name "*.sh" -o -name run -o -name up -o -name finish \) -exec chmod -v +x {} +

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            S6_ARCH=${{ matrix.s6 }}
          tags: |
            ${{ env.IMAGE }}:latest-${{ matrix.name }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.name }}

  manifest:
    name: Publish multi-arch manifest
    needs: image
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifests
        run: |
          for tag in latest "sha-${GITHUB_SHA}"; do
            docker buildx imagetools create \
              -t "${IMAGE}:${tag}" \
              "${IMAGE}:${tag}-amd64" \
              "${IMAGE}:${tag}-arm64" \
              "${IMAGE}:${tag}-armv7"
          done
