name: Build Web Console

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'web-console/**'
      - '.github/workflows/web-console.yml'
  pull_request:
    paths:
      - 'web-console/**'
      - '.github/workflows/web-console.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-console
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-web-console
          path: web-console/dist
          if-no-files-found: error
          retention-days: 30
